pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: npx biome check --write {staged_files}
      stage_fixed: true
    typescript:
      run: npx tsc --noEmit
    secretlint:
      glob: "**/*"
      run: npx secretlint --maskSecrets {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
