pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: npx biome check --write {staged_files}
      stage_fixed: true
    typescript:
      run: npx tsc --noEmit
    secretlint:
      glob: "*.{json,md,yml,yaml,env,env.*}"
      run: |
        if [ -n "{staged_files}" ]; then
          npx secretlint --maskSecrets {staged_files} 2>&1 | grep -v "Not found target files" || true
        fi

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
